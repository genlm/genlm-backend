name: Embedding inversion example
'on':
  pull_request: {}
  push:
    branches:
    - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install CPU test dependencies
      run: 'python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

        python -m pip install pytest hypothesis "numpy<2.5"'
    - name: Test frozen kernels and portable bundles
      run: python -m pytest --confcutdir=tests/embedding_inversion tests/embedding_inversion
