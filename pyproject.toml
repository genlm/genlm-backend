[project]
name = "genlm-backend"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ben LeBrun" },
]
dependencies = [
    "torch",
    "transformers>=5,<6",
    "sentencepiece",
    "protobuf",
    "accelerate",
    "bitsandbytes; sys_platform == 'linux'",
    "numba",
    # numba refuses to import above the NumPy it was built against; transformers 5
    # otherwise resolves numpy ahead of that bound.
    "numpy<2.5",
]

[project.optional-dependencies]
mlx = [
    # mlx carries no transformers dep of its own; pin it alongside the mlx-lm it
    # has to serve rather than letting it drift ahead.
    "mlx>=0.29.2",
    "mlx-lm>=0.30",
]
vllm = [
    # The engine-native arms (ControlSampler, run_burst) reach into vLLM v1
    # internals (Sampler.forward signature, input_batch.req_ids, the model-runner
    # sampler swap) that are version-specific; pin to the 0.21 line validated on
    # the box rather than advertising the whole >=0.10 range. 0.21 already admits
    # the transformers 5 line above, so this stays put.
    "vllm>=0.21.0,<0.22.0; sys_platform == 'linux'",
    "triton>=3.2.0; sys_platform == 'linux'",
]
sgl = [
    # sglang pins transformers EXACTLY (0.5.17 -> ==5.12.1), so installing this extra
    # nails the whole environment to that release. It is kept out of the core bound so
    # only an sglang install pays for it.
    "sglang>=0.5.17,<0.5.18",
]
lora = [
    "peft>=0.17",
]
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-material",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
]

[tool.setuptools.packages.find]
include = ["genlm", "genlm/backend"]
exclude = ["benchmark*", "tests*"]

[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
